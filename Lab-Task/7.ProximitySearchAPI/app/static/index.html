<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proximity Search</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1d2330; --muted:#6b7385; --line:#d9dde5; --road:#c9ced8;
          --accent:#2f6fde; --route:#e0663a; --circle:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --panel:#1b1f27; --ink:#e7eaf0; --muted:#97a0b2; --line:#2c323d; --road:#3a414e;
            --accent:#6f9cf0; --route:#f08a5d; --circle:#6f9cf0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:16px 20px 4px; }
  h1 { font-size:18px; margin:0 0 2px; }
  header p { margin:0; color:var(--muted); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; padding:12px 20px 20px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; padding:12px 16px; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  canvas { width:100%; aspect-ratio:1; display:block; cursor:crosshair; border-radius:6px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select, button { width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--line);
                          background:var(--bg); color:var(--ink); font:inherit; }
  button { background:var(--accent); color:#fff; border:0; margin-top:10px; cursor:pointer; font-weight:600; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:3px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  tr.sel td { background:color-mix(in srgb, var(--route) 18%, transparent); }
  tbody tr { cursor:pointer; }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; word-break:break-word; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  code { font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Proximity Search: nearest by road, filtered by radius</h1>
  <p>Click the map to set the pickup point. Thin lines are roads; gaps are missing links. The orange path is the driven route to the selected result.</p>
</header>
<main>
  <div class="card"><canvas id="map" width="900" height="900"></canvas>
    <div class="legend" id="legend"></div></div>
  <div class="card">
    <div class="row">
      <div><label for="lat">lat</label><input id="lat" type="number" step="0.001" value="0.5"></div>
      <div><label for="long">long</label><input id="long" type="number" step="0.001" value="0.5"></div>
    </div>
    <div class="row">
      <div><label for="cat">cat</label><select id="cat"></select></div>
      <div><label for="rad">rad</label><input id="rad" type="number" step="0.01" min="0" value="0.12"></div>
    </div>
    <button id="go">Search</button>
    <div class="meta" id="meta"></div>
    <table><thead><tr><th>#</th><th>ID</th><th>road</th><th>straight</th><th>detour</th></tr></thead>
      <tbody id="rows"></tbody></table>
    <div class="meta" id="url"></div>
  </div>
</main>
<script>
const PALETTE = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#b07aa1","#9c755f"];
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let NET = null, LAST = null, SEL = 0;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAD = 24, W = cv.width - 2 * PAD;
// lat grows upward like a map; long grows to the right
const X = lon => PAD + lon * W, Y = lat => PAD + (1 - lat) * W;
const nodeXY = v => { const n = NET.n, r = Math.floor(v / n), c = v % n; return [X(c / (n - 1)), Y(r / (n - 1))]; };

function draw() {
  if (!NET) return;
  const n = NET.n, missing = new Set(NET.missing.map(([a, b]) => a + "," + b));
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = css("--road"); ctx.lineWidth = 1; ctx.beginPath();
  for (let v = 0; v < n * n; v++) {
    const r = Math.floor(v / n), c = v % n, [x, y] = nodeXY(v);
    if (c + 1 < n && !missing.has(v + "," + (v + 1))) { const [x2, y2] = nodeXY(v + 1); ctx.moveTo(x, y); ctx.lineTo(x2, y2); }
    if (r + 1 < n && !missing.has(v + "," + (v + n))) { const [x2, y2] = nodeXY(v + n); ctx.moveTo(x, y); ctx.lineTo(x2, y2); }
  }
  ctx.stroke();
  const want = document.getElementById("cat").value, ci = NET.categories.indexOf(want);
  for (let v = 0; v < n * n; v++) {
    const [x, y] = nodeXY(v), on = NET.cat[v] === ci;
    ctx.fillStyle = PALETTE[NET.cat[v]]; ctx.globalAlpha = on ? 0.95 : 0.18;
    ctx.beginPath(); ctx.arc(x, y, on ? 2.6 : 1.6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const lat = +document.getElementById("lat").value, lon = +document.getElementById("long").value,
        rad = +document.getElementById("rad").value;
  ctx.strokeStyle = css("--circle"); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.arc(X(lon), Y(lat), rad * W, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  if (LAST && LAST.results.length) {
    const sel = LAST.results[SEL], idOf = id => id - 1;
    ctx.strokeStyle = css("--route"); ctx.lineWidth = 3.5; ctx.beginPath();
    sel.route.forEach((id, i) => { const [x, y] = nodeXY(idOf(id)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    LAST.results.forEach((r, i) => {
      const [x, y] = nodeXY(idOf(r.id));
      ctx.fillStyle = i === SEL ? css("--route") : css("--ink");
      ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
      ctx.fillStyle = css("--panel"); ctx.font = "bold 8px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(i + 1, x, y + 0.5);
    });
  }
  ctx.fillStyle = css("--ink"); ctx.beginPath(); ctx.arc(X(lon), Y(lat), 5, 0, 7); ctx.fill();
  ctx.strokeStyle = css("--panel"); ctx.lineWidth = 2; ctx.stroke();
}

async function run() {
  const q = new URLSearchParams({ lat: lat.value, long: long.value, cat: cat.value, rad: rad.value });
  const url = "search/?" + q;
  document.getElementById("url").innerHTML = "<code>GET /" + url + "</code>";
  const res = await fetch(url + "&debug=1"), body = await res.json();
  const rows = document.getElementById("rows"), meta = document.getElementById("meta");
  if (!res.ok) { meta.textContent = body.error; rows.innerHTML = ""; LAST = null; draw(); return; }
  LAST = body; SEL = 0;
  meta.textContent = `ids: [${body.ids.join(", ")}] · pickup node ${body.pickup_node.id} · ` +
    `${body.matches_in_radius} candidates in radius · ${body.nodes_explored} nodes explored · ${body.search_ms} ms`;
  rows.innerHTML = body.results.map((r, i) =>
    `<tr data-i="${i}"><td>${r.rank}</td><td>${r.id}</td><td>${r.road_segments}</td>` +
    `<td>${(r.straight_line * 99).toFixed(2)}</td><td>${r.detour_factor.toFixed(2)}×</td></tr>`).join("");
  rows.querySelectorAll("tr").forEach(tr => tr.onclick = () => { SEL = +tr.dataset.i; mark(); draw(); });
  mark(); draw();
}
function mark() { document.querySelectorAll("#rows tr").forEach(tr => tr.classList.toggle("sel", +tr.dataset.i === SEL)); }

cv.addEventListener("click", e => {
  const b = cv.getBoundingClientRect(), s = cv.width / b.width;
  const x = (e.clientX - b.left) * s, y = (e.clientY - b.top) * s;
  lat.value = Math.min(1, Math.max(0, 1 - (y - PAD) / W)).toFixed(4);
  long.value = Math.min(1, Math.max(0, (x - PAD) / W)).toFixed(4);
  run();
});
document.getElementById("go").onclick = run;
["cat", "rad"].forEach(id => document.getElementById(id).onchange = run);

fetch("network").then(r => r.json()).then(net => {
  NET = net;
  cat.innerHTML = net.categories.map(c => `<option${c === "cafe" ? " selected" : ""}>${c}</option>`).join("");
  document.getElementById("legend").innerHTML = net.categories.map((c, i) =>
    `<span><i style="background:${PALETTE[i]}"></i>${c}</span>`).join("") +
    `<span>roads drawn in grey · units in the table are grid steps</span>`;
  run();
});
</script>
</body>
</html>
