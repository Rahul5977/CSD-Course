# Load balancer for the lab deployment (user-space nginx on lbsys4, container port 4000
# → public http://10.1.75.53:4272). Start: nginx -c infra/lab/nginx-lb.conf -p ~/pond/lb
#
# Replicas keep their state in memory (villages, jobs), so a user must keep
# reaching the replica that ran their analysis: ip_hash gives client affinity.
# Passive health checks (max_fails / fail_timeout) take a dead replica out of
# rotation, and proxy_next_upstream retries a failed connection on the other
# one — the failover a single VM cannot give (the lbsys1 process died twice
# during the project). A failed-over user re-runs their analysis (~10 s).
worker_processes 2;
pid lb.pid;
error_log lb-error.log warn;
events { worker_connections 1024; }

http {
  access_log lb-access.log;
  client_body_temp_path tmp/client;
  proxy_temp_path tmp/proxy;
  fastcgi_temp_path tmp/fastcgi;
  uwsgi_temp_path tmp/uwsgi;
  scgi_temp_path tmp/scgi;
  client_max_body_size 64m;          # = POND_MAX_UPLOAD_MB

  upstream pond {
    ip_hash;
    server 10.1.75.53:4269 max_fails=2 fail_timeout=15s;   # replica 1 — lbsys1 :4000
    server 10.1.75.53:4270 max_fails=2 fail_timeout=15s;   # replica 2 — lbsys2 :4000
    server 10.1.75.53:4271 max_fails=2 fail_timeout=15s;   # replica 3 — lbsys3 :4000
    server 127.0.0.1:5000  max_fails=2 fail_timeout=15s;   # replica 4 — lbsys4 :5000
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 4000;
    location = /lb/health { return 200 "ok\n"; }
    location / {
      proxy_pass http://pond;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;          # job-progress WebSocket
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503;
      add_header X-Upstream $upstream_addr always;     # which replica answered
    }
  }
}
