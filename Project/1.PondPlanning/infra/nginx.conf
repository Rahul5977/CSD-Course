# Single-origin front door for the browser: static SPA, API and tiles.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Contour maps are a few MB; the API enforces its own cap too.
    client_max_body_size 256m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /health   { proxy_pass http://api:8000/health; }
    location = /ready    { proxy_pass http://api:8000/ready; }
    location /docs       { proxy_pass http://api:8000/docs; }
    location /redoc      { proxy_pass http://api:8000/redoc; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # TiTiler is mounted under /tiles so its templates never leak an internal host.
    location /tiles/ {
        proxy_pass http://titiler:80/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
