# Single-origin front door for the browser: static SPA, API and tiles.
# P6 hardening: rate limits per client and the standard security headers.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Contour maps are a few MB; the API enforces its own cap too.
    client_max_body_size 256m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/analyzeContour {
        limit_req zone=uploads burst=5 nodelay;
        proxy_pass http://api:8000/api/v1/analyzeContour;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /api/v1/jobs/ {
        # WebSocket progress + polling share this prefix.
        proxy_pass http://api:8000/api/v1/jobs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /health   { proxy_pass http://api:8000/health; }
    location = /ready    { proxy_pass http://api:8000/ready; }
    location /docs       { proxy_pass http://api:8000/docs; }
    location /redoc      { proxy_pass http://api:8000/redoc; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
    location = /metrics { proxy_pass http://api:8000/metrics; }

    # TiTiler is mounted under /tiles so its templates never leak an internal host.
    location /tiles/ {
        proxy_pass http://titiler:80/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
