# Development stack.
#
# Services arrive in the phase that first calls them (docs/adr/0004):
#   P0  postgres · redis · api
#   P1  minio (COG storage) · worker (Celery) · titiler (raster tiles) · web (nginx + SPA)
#   P6  worker split into interactive/heavy bulkheads · beat · prometheus · grafana
# so that every service in this file is one whose purpose can be explained on demand.

name: pond-planner

x-api-env: &api-env
  POND_ENV: docker
  POND_LOG_FORMAT: json
  POND_POSTGRES_HOST: postgres
  POND_POSTGRES_USER: ${POND_POSTGRES_USER:-pond}
  POND_POSTGRES_PASSWORD: ${POND_POSTGRES_PASSWORD:-pond}
  POND_POSTGRES_DB: ${POND_POSTGRES_DB:-pond}
  POND_REDIS_HOST: redis
  POND_PERSISTENCE: postgres
  POND_JOB_RUNNER: celery
  POND_OBJECT_STORE: minio
  POND_MINIO_ENDPOINT: minio:9000
  POND_MINIO_ACCESS_KEY: ${POND_MINIO_ACCESS_KEY:-pond}
  POND_MINIO_SECRET_KEY: ${POND_MINIO_SECRET_KEY:-pondpond}
  POND_MINIO_BUCKET: ${POND_MINIO_BUCKET:-pond}
  POND_TILES_PUBLIC_BASE: /tiles
  POND_GEOCODE_ENABLED: ${POND_GEOCODE_ENABLED:-true}

services:
  postgres:
    # PostGIS 3.4 on Postgres 16. TimescaleDB is added in P3, when the daily
    # rainfall series arrives and a hypertable actually earns its keep.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POND_POSTGRES_USER:-pond}
      POSTGRES_PASSWORD: ${POND_POSTGRES_PASSWORD:-pond}
      POSTGRES_DB: ${POND_POSTGRES_DB:-pond}
    ports:
      - "${POND_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The database name matters: without -d, pg_isready reports on the
      # default database and the API can start against a half-created one.
      # -h localhost forces TCP: initdb's temporary server on a fresh volume listens
      # on the unix socket only, so a socket probe reports "healthy" seconds before
      # the real server is up and the first migration hits "connection refused".
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POND_POSTGRES_USER:-pond} -d ${POND_POSTGRES_DB:-pond}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${POND_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # S3-compatible object store for every COG the pipeline writes. TiTiler
    # reads straight from it, so the API never streams raster bytes itself.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${POND_MINIO_ACCESS_KEY:-pond}
      MINIO_ROOT_PASSWORD: ${POND_MINIO_SECRET_KEY:-pondpond}
    ports:
      - "${POND_MINIO_PORT:-9000}:9000"
      - "${POND_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      <<: *api-env
    ports:
      - "${POND_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker-interactive:
    # Bulkhead 1: the short jobs a user is waiting on (catchment, runoff, pond
    # design). Its own worker, so a queue of village preparations can never
    # starve a click (ADR 0008). Threads pool: numpy releases the GIL, and one
    # process per worker means the Prometheus exporter sees every job (prefork
    # children would each hold their own registry).
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      [
        "celery", "-A", "app.jobs.celery_app:celery_app", "worker",
        "--queues", "interactive", "--pool", "threads", "--concurrency", "2",
        "--hostname", "interactive@%h", "--loglevel", "INFO",
      ]
    environment:
      <<: *api-env
      POND_METRICS_PORT: "9100"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping -d interactive@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker-heavy:
    # Bulkhead 2: contour analysis and suitability (minutes, external reads).
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command:
      [
        "celery", "-A", "app.jobs.celery_app:celery_app", "worker",
        "--queues", "heavy", "--pool", "threads", "--concurrency", "1",
        "--hostname", "heavy@%h", "--loglevel", "INFO",
      ]
    environment:
      <<: *api-env
      POND_METRICS_PORT: "9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    # Celery beat: the nightly rainfall refresh and the outbox drain. Leader
    # election for the refresh itself is a Redis lock inside the task.
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # The schedule file is derived state (rebuilt from beat_schedule on start), so it
    # lives in /tmp — the image runs as an unprivileged user with a read-only /srv.
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *api-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  titiler:
    # Dynamic raster tiles from COGs in MinIO. Reads byte ranges over S3, so a
    # new DEM is on the map the moment the worker finishes writing it.
    image: ghcr.io/developmentseed/titiler:0.21.0
    # TiTiler publishes amd64 images only; Docker Desktop on Apple Silicon runs
    # this one under emulation. Fine for tiles; not on the pipeline's hot path.
    platform: linux/amd64
    environment:
      AWS_ACCESS_KEY_ID: ${POND_MINIO_ACCESS_KEY:-pond}
      AWS_SECRET_ACCESS_KEY: ${POND_MINIO_SECRET_KEY:-pondpond}
      AWS_S3_ENDPOINT: minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      AWS_REGION: us-east-1
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      GDAL_CACHEMAX: "200"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.TIF,.tiff"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "5000000"
      TITILER_API_CORS_ORIGINS: "*"
    ports:
      - "${POND_TITILER_PORT:-8080}:80"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${POND_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    # One provisioned dashboard: queue depth, job p50/p95, provider errors, cache hit rate.
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${POND_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${POND_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  web:
    # nginx serving the built SPA and proxying /api → api, /tiles → titiler,
    # so the browser talks to one origin and no CORS configuration exists.
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "${POND_WEB_PORT:-3000}:80"
    depends_on:
      - api
      - titiler
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
