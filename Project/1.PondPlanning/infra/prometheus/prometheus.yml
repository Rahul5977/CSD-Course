global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: workers
    static_configs: [{ targets: ["worker-interactive:9100", "worker-heavy:9100"] }]
  # OpenTelemetry metrics, pushed by the app over OTLP and re-exposed by the
  # collector (ADR 0022).
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
