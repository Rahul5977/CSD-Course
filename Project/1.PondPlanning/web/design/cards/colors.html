<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colour roles</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>body{padding:20px;display:grid;gap:16px;align-content:start} .sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px} .sw div{border-radius:6px;padding:10px 8px;font-size:12px;min-height:64px;display:grid;align-content:end} .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}</style></head><body>
<div class="lbl">Ground and ink</div>
<div class="sw"><div style="background:var(--paper);border:1px solid var(--line)">--paper</div><div style="background:var(--panel);border:1px solid var(--line)">--panel</div><div style="background:var(--ink);color:#fff">--ink</div><div style="background:var(--ink-2);color:#fff">--ink-2</div><div style="background:var(--muted);color:#fff">--muted</div><div style="background:var(--night);color:#fff">--night</div></div>
<div class="lbl">Accent and earth</div>
<div class="sw"><div style="background:var(--water);color:#fff">--water</div><div style="background:var(--water-soft)">--water-soft</div><div style="background:var(--earth);color:#fff">--earth</div><div style="background:var(--earth-soft)">--earth-soft</div><div style="background:var(--line)">--line</div><div style="background:var(--line-strong)">--line-strong</div></div>
<div class="lbl">Status</div>
<div class="sw"><div style="background:var(--ok);color:#fff">--ok</div><div style="background:var(--ok-soft)">--ok-soft</div><div style="background:var(--warn);color:#fff">--warn</div><div style="background:var(--warn-soft)">--warn-soft</div><div style="background:var(--error);color:#fff">--error</div><div style="background:var(--error-soft)">--error-soft</div></div>
</body></html>
